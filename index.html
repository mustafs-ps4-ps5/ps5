<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mustafa PS4 PS5 Exploit Host</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1 class="main-title">
                <span class="highlight">Mustafa</span> 
                <span class="ps4-text">PS4</span> 
                <span class="ps5-text">PS5</span>
            </h1>
            <div class="subtitle">Exploit Host</div>
            <div class="version-badge">v3.0 — 10.00–11.02</div>
        </header>
        
        <hr class="separator">

        <div id="menu">
            <h2 class="fw-title" style="font-family:'Orbitron',sans-serif;font-size:18px;font-weight:700;color:#aabbdd;letter-spacing:2px;margin-bottom:5px;text-align:center;">⚡ Loading...</h2>
            <p class="fw-range" style="font-size:14px;color:#7788aa;margin-bottom:25px;text-align:center;">Detecting <span class="range-highlight" style="background:linear-gradient(135deg,#ff6b35,#ff2e63);padding:2px 12px;border-radius:12px;color:white;font-weight:700;">10.00 – 11.02</span></p>
            
            <div class="status-bar">
                <span id="msgs" class="status-text loading">⏳ Starting...</span>
            </div>

            <div style="display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:20px 0;">
                <a href="poops.html?go=1&trigger=netcontrol" class="btn btn-primary">🚀 Run NetControl</a>
                <a href="poops.html?go=1&trigger=overflow&burn=full" class="btn">🔥 Run Overflow</a>
                <a href="poops.html?clear=1" class="btn">🧹 Clear Latch</a>
            </div>

            <footer>
                <p class="credit">Designed by <a href="#" class="credit-link">Mustafa</a></p>
                <p class="thanks">❤️ Special thanks to all scene developers</p>
            </footer>
        </div>
    </div>

    <script>
        var msgs = document.getElementById('msgs');

        function updateStatus(msg) {
            msgs.innerHTML = msg;
        }

        var uaFull = navigator.userAgent;
        var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
        var isPS4 = match !== null;
        var fwVersion = isPS4 ? match[1] : "Unknown";
        var fwNum = parseFloat(fwVersion);

        document.addEventListener("DOMContentLoaded", function() {
            if (!isPS4) {
                updateStatus('⚠️ This page is for PS4 only!');
                msgs.className = 'status-text error';
                return;
            }

            if (fwNum >= 10.00 && fwNum <= 11.02) {
                updateStatus('✅ Detected PS4 Firmware: ' + fwVersion);
                
                setTimeout(function() {
                    updateStatus('🚀 Loading exploit...');
                    window.location.replace('run/index.html');
                }, 1500);
            } else {
                updateStatus('❌ Unsupported Firmware: ' + fwVersion + ' (Requires 10.00-11.02)');
                msgs.className = 'status-text error';
            }
        });
    </script>
</body>
</html>
