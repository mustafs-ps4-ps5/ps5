<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mustafa PS4 PS5 Exploit Host</title>
<style>
  /* ===== التصميم الجديد ===== */
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Tajawal:wght@400;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0; height: 100%;
    background: linear-gradient(135deg, #0a0e1a 0%, #1a1f35 50%, #0d1326 100%);
    background-attachment: fixed;
    color: #c8ced8;
    font-family: 'Tajawal', sans-serif;
    overflow: hidden;
  }

  #wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: 20px;
  }

  /* استبدال الصورة بعنوان نصي */
  #cat {
    display: none !important;
  }

  .main-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 42px;
    font-weight: 900;
    text-shadow: 0 0 30px rgba(0, 100, 255, 0.2);
    letter-spacing: 2px;
    text-align: center;
    margin-bottom: 5px;
  }

  .highlight {
    background: linear-gradient(135deg, #ff6b35, #ff2e63);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: 0 0 40px rgba(255, 46, 99, 0.3);
  }

  .ps4-text {
    background: linear-gradient(135deg, #0066ff, #00ccff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .ps5-text {
    background: linear-gradient(135deg, #ff0066, #ff33cc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    font-size: 14px;
    font-weight: 700;
    color: #8899bb;
    letter-spacing: 8px;
    text-transform: uppercase;
    margin-top: -5px;
    text-align: center;
  }

  .version-badge {
    display: inline-block;
    background: linear-gradient(135deg, #ff6b35, #ff2e63);
    color: white;
    font-family: 'Orbitron', sans-serif;
    font-size: 12px;
    font-weight: 700;
    padding: 3px 15px;
    border-radius: 20px;
    margin-top: 10px;
    letter-spacing: 1px;
    box-shadow: 0 4px 15px rgba(255, 46, 99, 0.3);
    text-align: center;
  }

  #actions {
    display: flex;
    flex-direction: column;
    gap: 14px;
    align-items: center;
    justify-content: center;
    margin-top: 10px;
  }

  .action {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: linear-gradient(135deg, #ff2e63, #ff6b35);
    color: white;
    min-width: 185px;
    height: 56px;
    padding: 0 30px;
    font-family: 'Orbitron', sans-serif;
    font-size: 16px;
    font-weight: 700;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
    letter-spacing: 1px;
    text-transform: uppercase;
    text-decoration: none;
    box-shadow: 0 8px 25px rgba(255, 46, 99, 0.3);
    text-align: center;
  }

  .action::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
    transition: all 0.5s ease;
  }

  .action:hover::before {
    left: 100%;
  }

  .action:hover {
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 12px 35px rgba(255, 46, 99, 0.5);
  }

  .action:active {
    transform: translateY(0px) scale(0.98);
  }

  .action.secondary {
    background: linear-gradient(135deg, #003263, #004a8f);
    box-shadow: 0 8px 25px rgba(0, 74, 143, 0.3);
  }

  .action.secondary:hover {
    box-shadow: 0 12px 35px rgba(0, 74, 143, 0.5);
  }

  .action.done {
    background: linear-gradient(135deg, #239d52, #126531);
    box-shadow: 0 12px 30px rgba(24, 142, 67, 0.26);
    pointer-events: none;
  }

  #status {
    font-family: 'Orbitron', sans-serif;
    font-size: 14px;
    font-weight: 400;
    color: #8899bb;
    letter-spacing: 1px;
    min-height: 1.5em;
    text-align: center;
  }

  .credit {
    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
    color: #556688;
    letter-spacing: 2px;
    text-align: center;
    margin-top: 10px;
  }

  .credit-link {
    background: linear-gradient(135deg, #ff6b35, #ff2e63);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-weight: 700;
    text-decoration: none;
    transition: all 0.3s ease;
  }

  .credit-link:hover {
    text-shadow: 0 0 30px rgba(255, 46, 99, 0.4);
  }

  .thanks {
    font-size: 13px;
    color: #6688aa;
    margin-top: 10px;
    letter-spacing: 1px;
    line-height: 1.8;
    text-align: center;
  }

  .thanks .heart { color: #ff2e63; }
  .thanks .devs { color: #47c76a; font-weight: 700; }

  @media (max-width: 650px) {
    #actions { width: 82vw; }
    .action { width: 100%; font-size: 13px; height: 50px; }
    .main-title { font-size: 28px; }
    .subtitle { font-size: 11px; letter-spacing: 5px; }
    #status { font-size: 12px; }
    .thanks { font-size: 11px; }
  }

  @media (max-width: 400px) {
    .main-title { font-size: 22px; }
    .action { font-size: 11px; height: 44px; gap: 8px; }
  }
</style>
</head>
<body>

  <div style="text-align:center;">

</div>
